[package]
name = "americartune"
version = "0.3.0"
edition = "2021"
description = "Open-source ECU tuning suite for American cars — real binary tooling for GM LS/LT, Ford Coyote/Power Stroke, Dodge Hemi/Cummins"
authors = ["AmericanTune Contributors"]
license = "Apache-2.0"
repository = "https://github.com/hashembasta8-dotcom/mericartune"
readme = "README.md"
keywords = ["ecu", "tuning", "automotive", "gm", "ford", "dodge"]
categories = ["command-line-utilities", "hardware-support"]

[features]
default = []
# Real serial-port I/O for ELM327 adapters (adds the `serialport` crate).
hardware = ["dep:serialport"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
serialport = { version = "4", optional = true, default-features = false }

[profile.release]
opt-level = 3
lto = true
strip = true
